<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12211C">
<meta name="description" content="F2FACE: presença por reconhecimento facial para academias. O aluno olha para o tablet e a presença conta para a próxima graduação.">
<title>F2FACE · Presença por reconhecimento facial para academias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--tatame:#12211C;--tatame-3:#26433A;--algodao:#EEF2EF;--muted:#9FB3AA;--medalha:#E0B341;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--tatame);color:var(--algodao);font-family:"Barlow","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:28px}
main{width:min(560px,100%)}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:clamp(64px,16vw,112px);line-height:.9;margin:0;letter-spacing:.02em}
p{color:var(--muted);font-size:19px;line-height:1.5;margin:14px 0 34px;max-width:440px}
.faixa{display:flex;height:18px;border-radius:3px;overflow:hidden;margin:26px 0 0;width:min(320px,100%);background:#1565C0}
.faixa i{margin-left:auto;width:26%;background:#1A1A1A;display:flex;align-items:center;justify-content:center;gap:5px}
.faixa i b{width:4px;height:12px;background:#fff}
nav{display:flex;gap:12px;flex-wrap:wrap}
a{display:inline-block;text-decoration:none;font-weight:600;padding:15px 24px;border-radius:12px;font-size:17px}
a.painel{background:var(--medalha);color:var(--tatame)}
a.tablet{border:2px solid var(--tatame-3);color:var(--algodao)}
a:focus-visible{outline:3px solid var(--medalha);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>F2FACE</h1>
  <div class="faixa" aria-hidden="true"><i><b></b><b></b><b></b></i></div>
  <p>Presença por reconhecimento facial para academias. O aluno olha para o tablet e a presença já conta para a próxima graduação.</p>
  <nav>
    <a class="painel" href="/painel/">Entrar no painel</a>
    <a class="tablet" href="/tablet/">Abrir o check-in do tablet</a>
  </nav>
</main>
</body>
</html>
